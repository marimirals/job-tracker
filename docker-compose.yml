services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
      POSTGRES_DB: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgres://jobtracker:jobtracker@db:5432/jobtracker?sslmode=disable
      GIGACHAT_CA_CERT: /certs/russian_trusted_root_ca.pem
    volumes:
      - ./server/certs:/certs:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: